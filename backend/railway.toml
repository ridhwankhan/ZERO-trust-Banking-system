# Railway Deployment Configuration
# This file tells Railway how to deploy your Django app

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate && gunicorn core.wsgi --bind 0.0.0.0:$PORT"

[env]
# Python version
PYTHON_VERSION = "3.9"

# Django settings
DJANGO_SETTINGS_MODULE = "core.settings"

# Security
DEBUG = "False"
SECRET_KEY = "your-production-secret-key-change-this-to-something-very-secure"

# Database (Railway will provide PostgreSQL)
DATABASE_URL = "{DATABASE_URL}"

# Allowed hosts (Railway will provide the domain)
ALLOWED_HOSTS = "{RAILWAY_STATIC_URL}"

# CORS - Update with your Vercel frontend URL
CORS_ALLOWED_ORIGINS = "https://zero-trust-banking-system.vercel.app"

# CSRF trusted origins
CSRF_TRUSTED_ORIGINS = "https://zero-trust-banking-system.vercel.app"